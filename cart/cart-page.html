<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FoodBuddy</title>
    <link rel="stylesheet" href="cart-page.css">
</head>

<body>
    <div class="container">
        
        <header>
            <a href="../Home/Home-page.html" class="logo">🍽️ FoodBuddy</a>
        </header>

        <div class="cart-container">
            
            <div class="cart-items">
                <h1 class="cart-title">Shopping Cart</h1>
                <div id="cartItemsList"></div>
            </div>

            
            <div class="order-summary">
                <h2 class="summary-title">Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₱0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee:</span>
                    <span id="deliveryFee">₱50.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₱0.00</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()">Proceed to Checkout</button>
                <button class="continue-shopping" onclick="window.location.href='../Home/Home-page.html'">Continue Shopping</button>
            </div>
        </div>
    </div>

<script src="cart-page.js"></script>
</body>
</html>
