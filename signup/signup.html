<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FoodBuddy</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
	<div id="notification" class="notification"></div>
    <div class="signup-container">
        <div class="signup-box">
            <div class="logo">🍽️ FoodBuddy</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join us and start ordering delicious food!</p>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <!-- Name Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" required>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" placeholder="+63 XXX XXX XXXX" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" required>
                    <small>Must be at least 8 characters</small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <!-- Terms -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the Terms & Conditions and Privacy Policy</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="signup-btn">Sign Up</button>

                
                <div class="login-link">
                    Already have an account? <a href="../index.html">Log In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="signup.js"></script>
</body>
</html>
